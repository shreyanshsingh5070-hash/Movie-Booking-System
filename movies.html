<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movies - CineBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body data-page="movies">

  <div id="navbar"></div>

  <main class="container mt-4">
    <h3 class="section-title mb-4">Movies</h3>

    <div class="row g-2 mb-3">
      <div class="col-md-5">
        <input type="text" id="searchBox" class="form-control" placeholder="Search by title, cast or director">
      </div>
      <div class="col-md-3">
        <select id="langFilter" class="form-select">
          <option value="">All Languages</option>
        </select>
      </div>
      <div class="col-md-2">
        <select id="sortBy" class="form-select">
          <option value="rating">Top Rated</option>
          <option value="title">A - Z</option>
          <option value="duration">Duration</option>
        </select>
      </div>
      <div class="col-md-2 d-grid">
        <button class="btn btn-outline-light" id="resetBtn">Reset</button>
      </div>
    </div>

    <!-- status + genre chips -->
    <div class="d-flex flex-wrap gap-2 mb-2" id="statusChips">
      <span class="filter-chip active" data-status="">All</span>
      <span class="filter-chip" data-status="now">Now Showing</span>
      <span class="filter-chip" data-status="soon">Coming Soon</span>
    </div>
    <div class="d-flex flex-wrap gap-2 mb-4" id="genreChips"></div>

    <div class="small text-muted mb-3" id="resultCount"></div>
    <div class="row g-3" id="movieGrid"></div>
    <div class="text-center text-muted py-5 d-none" id="noResult">
      <i class="bi bi-emoji-frown fs-1"></i>
      <p class="mt-2">No movies found. Try adjusting your filters.</p>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js?v=2"></script>
  <script src="js/common.js?v=2"></script>
  <script src="js/movies.js?v=2"></script>
</body>
</html>
