<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shows - CineBook Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=2">
</head>
<body data-root="../" data-page="admin-shows">

  <div class="d-flex flex-column flex-md-row">
    <aside class="admin-side" id="adminSide"></aside>

    <main class="flex-grow-1 p-3 p-md-4" style="min-width:0">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <h3 class="section-title mb-0">Manage Shows</h3>
        <button class="btn btn-brand" id="addShowBtn"><i class="bi bi-plus-lg me-1"></i>Schedule Show</button>
      </div>
      <div class="row g-2 mb-3">
        <div class="col-md-3"><input type="date" id="fDate" class="form-control"></div>
        <div class="col-md-4"><select id="fMovie" class="form-select"></select></div>
        <div class="col-md-3"><select id="fScreen" class="form-select"></select></div>
        <div class="col-md-2 d-grid"><button class="btn btn-outline-light" id="fReset">Reset</button></div>
      </div>
      <div class="card-dark p-3">
        <div class="table-responsive">
          <table class="table table-dark align-middle mb-0">
            <thead><tr><th>Date</th><th>Time</th><th>Movie</th><th>Screen</th><th>Seats Sold</th><th class="text-end">Action</th></tr></thead>
            <tbody id="showBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="showModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="showForm" novalidate>
          <div class="modal-header"><h5 class="modal-title">Schedule a Show</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <div class="mb-3"><label class="form-label">Movie *</label><select id="shMovie" class="form-select"></select></div>
            <div class="mb-3"><label class="form-label">Screen *</label><select id="shScreen" class="form-select"></select></div>
            <div class="row g-3">
              <div class="col-6"><label class="form-label">Date *</label><input type="date" id="shDate" class="form-control"></div>
              <div class="col-6"><label class="form-label">Time *</label><input type="time" id="shTime" class="form-control"></div>
            </div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-brand">Add Show</button></div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js?v=2"></script>
  <script src="../js/common.js?v=2"></script>
  <script src="../js/admin.js?v=2"></script>
  <script src="../js/admin-shows.js?v=2"></script>
</body>
</html>
