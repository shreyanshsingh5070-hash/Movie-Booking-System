<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login - CineBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=2">
</head>
<body data-root="../" data-page="admin-login">

  <main class="container">
    <div class="card-dark auth-box">
      <div class="text-center mb-4">
        <i class="bi bi-shield-lock text-brand" style="font-size:3rem"></i>
        <h4 class="mt-2 mb-0">Admin Login</h4>
        <div class="small text-muted">For theatre staff only</div>
      </div>

      <div class="alert alert-danger py-2 small d-none" id="errBox"></div>

      <form id="adminLoginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="user">Username</label>
          <input type="text" class="form-control" id="user" autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label" for="pass">Password</label>
          <input type="password" class="form-control" id="pass" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-brand w-100">Login</button>
      </form>

      <div class="text-center small text-muted mt-3">Demo login: <code>admin</code> / <code>admin123</code></div>
      <div class="text-center small mt-2"><a href="../index.html">&larr; Back to website</a></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js?v=2"></script>
  <script src="../js/common.js?v=2"></script>
  <script src="../js/admin.js?v=2"></script>
  <script>
    // If already logged in, go straight to the dashboard
    if (isAdmin()) window.location.replace('dashboard.html');

    document.getElementById('adminLoginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const u = document.getElementById('user').value.trim();
      const p = document.getElementById('pass').value;
      if (u === ADMIN_USER && p === ADMIN_PASS) {
        DB.set('admin', true);
        window.location.href = 'dashboard.html';
      } else {
        const box = document.getElementById('errBox');
        box.textContent = 'Invalid username or password.';
        box.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
