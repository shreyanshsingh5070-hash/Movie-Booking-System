<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screens - CineBook Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=2">
</head>
<body data-root="../" data-page="admin-screens">

  <div class="d-flex flex-column flex-md-row">
    <aside class="admin-side" id="adminSide"></aside>

    <main class="flex-grow-1 p-3 p-md-4" style="min-width:0">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <h3 class="section-title mb-0">Manage Screens</h3>
        <button class="btn btn-brand" id="addScreenBtn"><i class="bi bi-plus-lg me-1"></i>Add Screen</button>
      </div>
      <div class="row g-3" id="screenGrid"></div>
      <div class="small text-muted mt-3">Seat type is assigned automatically by row: front rows are Normal, middle rows are Premium and back rows are Recliner.</div>
    </main>
  </div>

  <div class="modal fade" id="screenModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="screenForm" novalidate>
          <div class="modal-header"><h5 class="modal-title" id="screenModalTitle">Add Screen</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <input type="hidden" id="sId">
            <div class="mb-3"><label class="form-label">Screen Name *</label><input type="text" id="sName" class="form-control" placeholder="Screen 4"></div>
            <div class="row g-3">
              <div class="col-6"><label class="form-label">Rows (4 - 10)</label><input type="number" id="sRows" class="form-control" min="4" max="10" value="8"></div>
              <div class="col-6"><label class="form-label">Seats per row (6 - 14)</label><input type="number" id="sCols" class="form-control" min="6" max="14" value="10"></div>
            </div>
            <div class="small text-muted mt-3" id="sTotal"></div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-brand">Save</button></div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js?v=2"></script>
  <script src="../js/common.js?v=2"></script>
  <script src="../js/admin.js?v=2"></script>
  <script src="../js/admin-screens.js?v=2"></script>
</body>
</html>
