<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - CineBook Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=2">
</head>
<body data-root="../" data-page="admin-dashboard">

  <div class="d-flex flex-column flex-md-row">
    <aside class="admin-side" id="adminSide"></aside>

    <main class="flex-grow-1 p-3 p-md-4" style="min-width:0">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <h3 class="section-title mb-0">Dashboard</h3>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-light btn-sm" id="demoBtn"><i class="bi bi-magic me-1"></i>Add Demo Bookings</button>
          <button class="btn btn-outline-danger btn-sm" id="clearDemoBtn">Clear Demo Data</button>
        </div>
      </div>

      <div class="row g-3 mb-4" id="statCards"></div>

      <div class="row g-4">
        <div class="col-xl-7">
          <div class="card-dark p-3">
            <h6 class="mb-3">Recent Bookings</h6>
            <div class="table-responsive">
              <table class="table table-dark table-sm align-middle mb-0">
                <thead><tr><th>ID</th><th>User</th><th>Movie</th><th>Seats</th><th class="text-end">Amount</th><th>Status</th></tr></thead>
                <tbody id="recentBody"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-xl-5">
          <div class="card-dark p-3">
            <h6 class="mb-3">Today's Shows</h6>
            <div id="todayShows"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js?v=2"></script>
  <script src="../js/common.js?v=2"></script>
  <script src="../js/admin.js?v=2"></script>
  <script src="../js/admin-dashboard.js?v=2"></script>
</body>
</html>
