<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movies - CineBook Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=2">
</head>
<body data-root="../" data-page="admin-movies">

  <div class="d-flex flex-column flex-md-row">
    <aside class="admin-side" id="adminSide"></aside>

    <main class="flex-grow-1 p-3 p-md-4" style="min-width:0">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <h3 class="section-title mb-0">Manage Movies</h3>
        <button class="btn btn-brand" id="addMovieBtn"><i class="bi bi-plus-lg me-1"></i>Add Movie</button>
      </div>
      <div class="card-dark p-3">
        <div class="table-responsive">
          <table class="table table-dark align-middle mb-0">
            <thead><tr><th>Movie</th><th>Genre</th><th>Language</th><th>Duration</th><th>Rating</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="movieBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="movieModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <form id="movieForm" novalidate>
          <div class="modal-header"><h5 class="modal-title" id="movieModalTitle">Add Movie</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <input type="hidden" id="mId">
            <div class="row g-3">
              <div class="col-md-8"><label class="form-label">Title *</label><input type="text" id="mTitle" class="form-control"></div>
              <div class="col-md-4"><label class="form-label">Certificate</label>
                <select id="mCert" class="form-select"><option>U</option><option>UA</option><option>A</option></select></div>
              <div class="col-md-4"><label class="form-label">Genre *</label><input type="text" id="mGenre" class="form-control" placeholder="Action, Comedy..."></div>
              <div class="col-md-4"><label class="form-label">Language *</label><input type="text" id="mLang" class="form-control" placeholder="Hindi"></div>
              <div class="col-md-4"><label class="form-label">Duration (min) *</label><input type="number" id="mDur" class="form-control" min="30" max="300"></div>
              <div class="col-md-4"><label class="form-label">Rating (0-10)</label><input type="number" id="mRating" class="form-control" min="0" max="10" step="0.1" value="0"></div>
              <div class="col-md-4"><label class="form-label">Status</label>
                <select id="mStatus" class="form-select"><option value="now">Now Showing</option><option value="soon">Coming Soon</option></select></div>
              <div class="col-md-4"><label class="form-label">Poster Color</label><select id="mColor" class="form-select"></select></div>
              <div class="col-md-6"><label class="form-label">Director</label><input type="text" id="mDirector" class="form-control"></div>
              <div class="col-md-6"><label class="form-label">Cast</label><input type="text" id="mCast" class="form-control" placeholder="Separate names with commas"></div>
              <div class="col-12"><label class="form-label">Description</label><textarea id="mDesc" class="form-control" rows="3"></textarea></div>
            </div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-brand">Save Movie</button></div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js?v=2"></script>
  <script src="../js/common.js?v=2"></script>
  <script src="../js/admin.js?v=2"></script>
  <script src="../js/admin-movies.js?v=2"></script>
</body>
</html>
