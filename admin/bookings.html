<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookings - CineBook Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=2">
</head>
<body data-root="../" data-page="admin-bookings">

  <div class="d-flex flex-column flex-md-row">
    <aside class="admin-side" id="adminSide"></aside>

    <main class="flex-grow-1 p-3 p-md-4" style="min-width:0">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <h3 class="section-title mb-0">All Bookings</h3>
        <button class="btn btn-outline-light btn-sm" id="csvBtn"><i class="bi bi-download me-1"></i>Export CSV</button>
      </div>
      <div class="row g-2 mb-3">
        <div class="col-md-5"><input type="text" id="bSearch" class="form-control" placeholder="Booking ID or user name"></div>
        <div class="col-md-3"><select id="bMovie" class="form-select"></select></div>
        <div class="col-md-2"><select id="bStatus" class="form-select"><option value="">All Status</option><option>Confirmed</option><option>Cancelled</option></select></div>
        <div class="col-md-2 d-grid"><button class="btn btn-outline-light" id="bReset">Reset</button></div>
      </div>
      <div class="small text-muted mb-2" id="bCount"></div>
      <div class="card-dark p-3">
        <div class="table-responsive">
          <table class="table table-dark table-sm align-middle mb-0">
            <thead><tr><th>Booking ID</th><th>User</th><th>Movie</th><th>Show</th><th>Seats</th><th class="text-end">Amount</th><th>Payment</th><th>Status</th><th></th></tr></thead>
            <tbody id="bBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js?v=2"></script>
  <script src="../js/common.js?v=2"></script>
  <script src="../js/admin.js?v=2"></script>
  <script src="../js/admin-bookings.js?v=2"></script>
</body>
</html>
