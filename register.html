<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - CineBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">

  <div id="navbar"></div>

  <main class="container">
    <div class="card-dark auth-box">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus text-brand" style="font-size:3rem"></i>
        <h4 class="mt-2 mb-0">Create account</h4>
        <div class="small text-muted">Sign up in less than a minute</div>
      </div>

      <div class="alert alert-danger py-2 small d-none" id="errBox"></div>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" class="form-control" id="name" placeholder="Your full name" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="phone">Mobile Number</label>
          <input type="tel" class="form-control" id="phone" maxlength="10" placeholder="10-digit mobile number" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Minimum 6 characters" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password2">Confirm Password</label>
          <input type="password" class="form-control" id="password2" placeholder="Re-enter your password" required>
        </div>
        <button type="submit" class="btn btn-brand w-100">Sign Up</button>
      </form>

      <p class="text-center small text-muted mt-3 mb-0">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
