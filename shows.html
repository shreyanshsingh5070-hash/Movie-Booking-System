<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Show Timings - CineBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body data-page="shows">

  <div id="navbar"></div>

  <main class="container mt-4">
    <h3 class="section-title mb-4">Show Timings</h3>

    <div class="row g-3 align-items-center mb-4">
      <div class="col-md-5">
        <label class="form-label">Movie</label>
        <select id="movieSelect" class="form-select"></select>
      </div>
    </div>

    <!-- date tabs -->
    <div class="d-flex gap-2 overflow-auto pb-2 mb-4" id="dateTabs"></div>

    <div id="showList"></div>

    <div class="small text-muted mt-4">
      <span class="legend-box" style="border-color:#3fa34d"></span> Available &nbsp;
      <span class="legend-box" style="border-color:#666"></span> Sold out / Show ended
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js?v=2"></script>
  <script src="js/common.js?v=2"></script>
  <script src="js/shows.js?v=2"></script>
</body>
</html>
