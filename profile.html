<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile - CineBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="profile">

  <div id="navbar"></div>

  <main class="container mt-4">
    <h3 class="section-title mb-4">My Profile</h3>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card-dark p-4 text-center">
          <div class="rounded-circle bg-danger d-inline-flex align-items-center justify-content-center fw-bold" style="width:84px;height:84px;font-size:2rem" id="avatar">U</div>
          <h5 class="mt-3 mb-0" id="pName"></h5>
          <div class="small text-muted" id="pEmail"></div>
          <div class="small text-muted" id="pJoined"></div>
          <hr style="border-color:#2d2d3a">
          <div class="row">
            <div class="col-6"><div class="fs-4 fw-bold" id="statBookings">0</div><div class="small text-muted">Bookings</div></div>
            <div class="col-6"><div class="fs-4 fw-bold" id="statSpent">0</div><div class="small text-muted">Total spent</div></div>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card-dark p-4 mb-4">
          <h5 class="mb-3">Personal Details</h5>
          <form id="detailsForm" novalidate>
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Full Name</label><input type="text" id="fName" class="form-control"></div>
              <div class="col-md-6"><label class="form-label">Mobile</label><input type="tel" id="fPhone" class="form-control" maxlength="10"></div>
              <div class="col-12"><label class="form-label">Email (cannot be changed)</label><input type="email" id="fEmail" class="form-control" disabled></div>
            </div>
            <button class="btn btn-brand mt-3" type="submit">Save Changes</button>
          </form>
        </div>

        <div class="card-dark p-4">
          <h5 class="mb-3">Change Password</h5>
          <form id="passForm" novalidate>
            <div class="row g-3">
              <div class="col-md-4"><label class="form-label">Current Password</label><input type="password" id="oldPass" class="form-control"></div>
              <div class="col-md-4"><label class="form-label">New Password</label><input type="password" id="newPass" class="form-control"></div>
              <div class="col-md-4"><label class="form-label">Confirm New</label><input type="password" id="newPass2" class="form-control"></div>
            </div>
            <button class="btn btn-outline-light mt-3" type="submit">Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
