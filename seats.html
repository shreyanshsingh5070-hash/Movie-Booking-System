<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select Seats - CineBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body data-page="shows">

  <div id="navbar"></div>

  <main class="container mt-4">
    <div id="showInfo" class="mb-4"></div>

    <div class="text-center mb-3 small">
      <span class="legend-box"></span>Available &nbsp;
      <span class="legend-box" style="background:var(--brand);border-color:var(--brand)"></span>Selected &nbsp;
      <span class="legend-box" style="background:#3a3a46;border-color:#3a3a46"></span>Booked
    </div>

    <div class="card-dark p-3 p-md-4 overflow-auto">
      <div id="seatMap"></div>
      <div class="screen-bar"></div>
      <div class="screen-label">SCREEN</div>
    </div>
  </main>

  <!-- sticky bottom booking bar -->
  <div class="booking-bar mt-4 no-print" id="bookingBar">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div>
        <div class="small text-muted" id="selText">No seats selected</div>
        <div class="fw-bold fs-5" id="selTotal">&#8377;0</div>
      </div>
      <button class="btn btn-brand btn-lg px-4" id="proceedBtn" disabled>Proceed to Pay <i class="bi bi-arrow-right ms-1"></i></button>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js?v=2"></script>
  <script src="js/common.js?v=2"></script>
  <script src="js/seats.js?v=2"></script>
</body>
</html>
